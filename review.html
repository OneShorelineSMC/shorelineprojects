<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoAtlas Project Review</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f8; --card: #ffffff; --text: #1d2327; --muted: #5f6b73;
    --line: #d9dee2; --accent: #244161; --accent-ink: #ffffff; --blank: #fff7d1; --blank-line: #e8c56a;
    --ok: #2e7d32; --warn: #a15c00; --changed: #c2185b; --chip: #e9edf1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191c; --panel: #1c2125; --card: #20262b; --text: #e6e9ec; --muted: #9aa5ad;
      --line: #343c43; --accent: #7fa8d6; --accent-ink: #0f1a26; --blank: #3a3215; --blank-line: #8a7230;
      --ok: #6fbf73; --warn: #e0a24a; --changed: #f06292; --chip: #2a3238;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191c; --panel: #1c2125; --card: #20262b; --text: #e6e9ec; --muted: #9aa5ad;
    --line: #343c43; --accent: #7fa8d6; --accent-ink: #0f1a26; --blank: #3a3215; --blank-line: #8a7230;
    --ok: #6fbf73; --warn: #e0a24a; --changed: #f06292; --chip: #2a3238;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); padding: 6px 10px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.icon { padding: 2px 7px; line-height: 1.2; }

  #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; }
  .beta { display: inline-block; vertical-align: 2px; margin-left: 4px; padding: 1px 8px; border-radius: 999px;
    background: #fff4d6; color: #7a5200; border: 1px solid #e8c56a; font-size: 11px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; }
  .spacer { flex: 1; }
  #saveState { color: var(--muted); font-size: 12px; }
  #saveState.dirty { color: var(--changed); font-weight: 600; }
  .hdr-actions { display: flex; flex-wrap: wrap; gap: 6px; }

  #main { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .list-tools { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .list-tools input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--text); font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border-radius: 999px; padding: 3px 10px; font-size: 12px; background: var(--chip); border-color: transparent; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  #list { overflow-y: auto; flex: 1; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--chip); }
  .item[aria-current="true"] { background: var(--card); box-shadow: inset 3px 0 0 var(--accent); }
  .item .nm { font-weight: 600; font-size: 13px; }
  .item .meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; max-width: 110px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .tag.ok { color: var(--ok); }
  .tag.changed { color: var(--changed); }
  .count { color: var(--muted); font-size: 12px; }
  #newForm { display: none; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  #newForm.open { display: grid; }
  #newForm label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  #newForm input, #newForm select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    color: var(--text); font: inherit; width: 100%; }
  #newForm .row2 { display: flex; gap: 8px; }
  #newMsg { font-size: 12px; color: var(--warn); min-height: 1em; }
  .tag.new { color: var(--accent); }
  .tag.os { color: #1b5e20; background: #dff2e1; }
  .entry { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 8px 12px; border-radius: 8px;
    margin-bottom: 10px; font-size: 13px; border: 1px solid var(--line); background: var(--panel); }
  .entry strong { font-size: 13px; }
  .entry.os { background: #e3f4e5; border-color: #81c784; color: #1b5e20; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .entry.os { background: #1f3323; border-color: #3f7d45; color: #a5d6a7; }
    :root:not([data-theme="light"]) .tag.os { background: #1f3323; color: #a5d6a7; } }
  :root[data-theme="dark"] .entry.os { background: #1f3323; border-color: #3f7d45; color: #a5d6a7; }
  button.danger { color: #b3261e; }

  section#detail { overflow-y: auto; padding: 16px 20px 60px; min-width: 0; }
  .empty-state { color: var(--muted); padding: 40px 0; }
  .ptitle { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 12px; }
  .ptitle h2 { font-size: 20px; margin: 0; flex: 1 1 320px; }
  .subline { color: var(--muted); font-size: 13px; margin: 4px 0 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .reviewed-toggle { display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--card); cursor: pointer; }
  .reviewed-toggle.on { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .missing { background: var(--blank); border: 1px solid var(--blank-line); border-radius: 8px; padding: 8px 12px;
    font-size: 13px; margin-bottom: 14px; }
  .missing a { cursor: pointer; margin-right: 6px; white-space: nowrap; }
  .missing.none { background: var(--card); border-color: var(--line); color: var(--ok); }

  details.sec { border: 1px solid var(--line); border-radius: 8px; background: var(--card); margin-bottom: 12px; }
  details.sec > summary { list-style: none; cursor: pointer; padding: 10px 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary .caret { width: 10px; transition: transform .15s; display: inline-block; }
  details.sec[open] > summary .caret { transform: rotate(90deg); }
  details.sec > summary .sum-note { color: var(--muted); font-weight: 400; font-size: 12px; }
  .sec-body { padding: 4px 14px 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 14px; }
  .field { display: grid; gap: 3px; align-content: start; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field textarea, td input {
    width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    color: var(--text); font: inherit; }
  .field textarea { min-height: 84px; resize: vertical; }
  .field.blank input, .field.blank textarea, td.blank input { background: var(--blank); border-color: var(--blank-line); }
  .field .hint { font-size: 11px; color: var(--muted); }
  .calc { font-weight: 600; padding: 6px 0; }
  .calc.gap { color: var(--warn); }
  .src-badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .src-badge.thin { border-color: var(--blank-line); background: var(--blank); }

  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel);
    padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 4px; border-bottom: 1px solid var(--line); min-width: 120px; vertical-align: top; }
  td.act { min-width: 0; width: 1%; white-space: nowrap; }
  td input { padding: 4px 6px; }
  .tbl-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .none-row { color: var(--muted); font-size: 13px; padding: 10px; }
  .nav-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }

  .banner { margin: 10px 16px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--blank-line);
    background: var(--blank); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .banner .spacer { flex: 1; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.show { opacity: 1; }

  #listToggle { display: none; }
  @media (max-width: 820px) {
    #main { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: min(88vw, 340px); z-index: 20; transform: translateX(-100%);
      transition: transform .2s; box-shadow: 0 0 20px rgba(0,0,0,.25); }
    aside.open { transform: translateX(0); }
    #listToggle { display: inline-block; }
    section#detail { padding: 14px 16px 60px; }
    header { padding: 10px 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="listToggle" type="button" aria-label="Show project list">☰ Projects</button>
    <h1>EcoAtlas Project Review <span class="beta">Beta</span></h1>
    <a href="index.html">← Back to map</a>
    <span class="spacer"></span>
    <span id="saveState">Loading…</span>
    <div class="hdr-actions">
      <button id="btnJson" class="primary" type="button" title="Download the data file to upload to GitHub">Download data file</button>
      <button id="btnXlsx" type="button">Download Excel</button>
      <button id="btnImport" type="button">Import file</button>
      <input id="fileImport" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <div id="banners"></div>
  <div id="main">
    <aside id="aside">
      <div class="list-tools">
        <input id="search" type="search" placeholder="Search projects" aria-label="Search projects">
        <div class="chips" id="filters">
          <button class="chip" data-f="all" aria-pressed="true" type="button">All</button>
          <button class="chip" data-f="needs" aria-pressed="false" type="button">Needs data</button>
          <button class="chip" data-f="unreviewed" aria-pressed="false" type="button">Not reviewed</button>
          <button class="chip" data-f="reviewed" aria-pressed="false" type="button">Reviewed</button>
          <button class="chip" data-f="changed" aria-pressed="false" type="button">Edited</button>
          <button class="chip" data-f="os" aria-pressed="false" type="button">OneShoreline entries</button>
        </div>
        <button id="btnNew" type="button">+ New project</button>
        <form id="newForm" autocomplete="off">
          <label>Project name (required)<input id="newName" required></label>
          <label>EcoAtlas Project ID (if it has one)<input id="newId" inputmode="numeric" placeholder="e.g. 12465"></label>
          <label>Region<select id="newRegion"><option>Bayside</option><option>Coastside</option></select></label>
          <div id="newMsg"></div>
          <div class="row2"><button class="primary" type="submit">Add project</button><button type="button" id="newCancel">Cancel</button></div>
        </form>
        <div class="count" id="listCount"></div>
      </div>
      <div id="list" role="list"></div>
    </aside>
    <section id="detail"><div class="empty-state">Loading projects…</div></section>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ======================= settings ======================= */
const DATA_URL = "review_data.json";
const STORE_KEY = "ecoatlas-review-draft-v1";

/* Fields shown in each section. kind: text | long | num | money | date | url | list (suggestions) */
const SECTIONS = [
  { id: "overview", title: "Overview", fields: [
    ["name", "Project name", "text", { wide: true }],
    ["status", "Status", "list", { options: ["Proposed", "Planning", "Permitting", "In-progress", "Completed", "Unknown"] }],
    ["type", "Project type", "list", { options: ["Non-mitigation", "Compensatory mitigation", "Repair/Maintenance", "Impact", "Unknown/Unspecified"] }],
    ["county", "County", "text"],
    ["acres", "Project area (acres)", "num"],
    ["groups", "Project groups", "text", { hint: "Separate several with semicolons" }],
    ["admin_region", "Administrative region", "text"],
    ["abstract", "Project abstract", "long", { wide: true }]
  ]},
  { id: "location", title: "Location and dates", fields: [
    ["lat", "Latitude", "num", { hint: "Decimal degrees" }],
    ["lon", "Longitude", "num", { hint: "Negative = west" }],
    ["last_updated", "EcoAtlas last updated", "date"]
  ]},
  { id: "funding", title: "Funding", fields: [
    ["funding_need", "Funding need ($)", "money", { hint: "As reported on EcoAtlas" }]
  ], table: "funding", calc: "funding" },
  { id: "oneshoreline", title: "OneShoreline fields", note: "not EcoAtlas fields", fields: [
    ["region", "Region", "list", { options: ["Bayside", "Coastside"] }],
    ["ownership", "Public / Private", "list", { options: ["Public", "Private"] }],
    ["oneshoreline", "OneShoreline-related", "list", { options: ["Yes", "No"] }],
    ["cost", "Cost (published)", "text"],
    ["cost_basis", "Cost basis", "long", { wide: true, hint: "What the cost covers, and its year" }],
    ["cost_source", "Cost source", "long", { wide: true }],
    ["notes", "Notes", "long", { wide: true }]
  ]},
  { id: "climate", title: "Climate adaptation", fields: [
    ["design_year", "Project design year", "num"],
    ["slr_ft", "SLR design condition (ft)", "num"],
    ["storm_event", "Storm event design condition", "text"],
    ["adaptation_type", "Adaptation project type", "text"],
    ["gw_adaptable", "Shallow groundwater adaptable?", "text"]
  ]},
  { id: "sites", title: "Sites", table: "sites" },
  { id: "habitat", title: "Habitat plan", table: "habitat_plan" },
  { id: "contacts", title: "Contacts", table: "contacts" },
  { id: "events", title: "Events", table: "events" },
  { id: "ids", title: "Project identification", table: "project_ids" },
  { id: "impacts", title: "Related habitat impacts", table: "habitat_impacts" },
  { id: "benefits", title: "Project benefits", table: "benefits" },
  { id: "cram", title: "CRAM assessments", table: "cram" },
  { id: "review", title: "Review", fields: [
    ["review_notes", "Review notes", "long", { wide: true, hint: "Your notes on what's missing, questionable or confirmed" }]
  ]}
];

/* Repeating EcoAtlas tables: key, columns [field, label, kind, options] */
const TABLES = {
  sites:           [["site_name", "Site name"], ["status", "Status", "list", ["Proposed", "Planning/Scoping", "Permitting", "Construction planned", "Construction in-progress", "In-progress/Implementation", "Construction completed", "Completed", "Unknown/Unspecified"]], ["acres", "Acres", "num"]],
  habitat_plan:    [["site_name", "Site name"], ["phase", "Phase"], ["activity", "Activity"], ["subactivities", "SubActivities"], ["habitat", "Habitat"], ["subhabitat", "SubHabitat"], ["acres", "Acres", "num"], ["activity_status", "Activity status"], ["water_regime", "Water regime"]],
  funding:         [["phase", "Phase"], ["activity", "Activity"], ["funder", "Funder"], ["amount", "Amount ($)", "money"]],
  contacts:        [["type", "Type"], ["name", "Name"], ["organization", "Organization"], ["department", "Department"]],
  events:          [["date", "Date", "date"], ["event", "Event"], ["description", "Description"], ["site", "Site"]],
  project_ids:     [["id", "ID"], ["type", "Type"]],
  habitat_impacts: [["impact_project_name", "Impact project name"], ["habitat", "Habitat"], ["acres_lost", "Acres lost", "num"], ["type_of_loss", "Type of loss"]],
  benefits:        [["category", "Benefit category"], ["tracking", "Benefit tracking", "list", ["No tracking", "Quantitative metrics collected"]], ["units", "Measurement units"]],
  cram:            [["visit_date", "Visit date", "date"], ["version", "Version"], ["site_name", "Site name"], ["wetland_type", "Wetland type"], ["index_score", "Index score", "num"]]
};

/* What counts toward "complete" */
const KEY_FIELDS = ["name", "status", "type", "county", "acres", "groups", "admin_region", "abstract", "lat", "lon",
  "last_updated", "funding_need", "cost", "cost_basis", "region", "ownership", "oneshoreline"];
const KEY_TABLES = ["sites", "habitat_plan", "funding", "contacts"];

/* Excel export layout, matching the EcoAtlas template */
const XLSX_PROJECT_COLS = [
  ["id", "EcoAtlas Project ID"], ["name", "Project Name"], ["url", "EcoAtlas URL"], ["status", "Status"], ["county", "County"],
  ["type", "Project Type"], ["acres", "Project Area (acres)"], ["groups", "Project Groups"], ["admin_region", "Administrative Region"],
  ["abstract", "Project Abstract"], ["lat", "Latitude"], ["lon", "Longitude"], ["last_updated", "Last Updated"],
  ["funding_need", "Funding Need ($)"], ["_funding_total", "Total Funding Listed ($)"], ["design_year", "Project Design Year"],
  ["slr_ft", "SLR Design Condition (ft)"], ["storm_event", "Storm Event Design Condition"], ["adaptation_type", "Adaptation Project Type"],
  ["gw_adaptable", "Shallow Groundwater Adaptable?"], ["region", "Region (Coastside/Bayside)"], ["ownership", "Public / Private"],
  ["oneshoreline", "OneShoreline-related"], ["cost", "Cost (published)"], ["cost_basis", "Cost Basis"], ["cost_source", "Cost Source"],
  ["notes", "Notes"], ["_os_entry", "OneShoreline Entry"], ["data_source", "Data Source"], ["reviewed", "Reviewed"], ["review_notes", "Review Notes"]
];
const XLSX_SHEETS = { sites: "Sites", habitat_plan: "Habitat Plan", funding: "Funding", contacts: "Contacts", events: "Events",
  project_ids: "Project IDs", habitat_impacts: "Habitat Impacts", benefits: "Benefits", cram: "CRAM Assessments" };

/* ======================= state ======================= */
let base = null;      // the data file as published in the repo
let data = null;      // working copy (with edits)
let currentId = null;
let filter = "all";
let lastDownloadedSig = null;

const $ = (id) => document.getElementById(id);
const blank = (v) => v === null || v === undefined || (typeof v === "string" && v.trim() === "");
const clone = (o) => JSON.parse(JSON.stringify(o));
const fmtMoney = (n) => (typeof n === "number" && isFinite(n)) ? "$" + Math.round(n).toLocaleString() : "—";
const byId = (set, id) => set.projects.find((p) => String(p.id) === String(id));
const OS_ORG = /oneshoreline|flood and sea level rise resiliency/i;
function osContacts(p) { return (p.contacts || []).filter((c) => OS_ORG.test(c.organization || "")); }
function isOsEntry(p) { return !!p.added_in_review || osContacts(p).length > 0; }
const ecoUrl = (id) => `https://www.ecoatlas.org/regions/ecoregion/statewide/projects/${id}`;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function store() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ baseUpdated: base.updated, baseVersion: base.version, data, lastDownloadedSig })); }
  catch (e) { /* storage unavailable: edits live only in this tab */ }
  updateSaveState();
}
function loadDraft() {
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function clearDraft() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

const sig = (o) => JSON.stringify(o);
function isChanged(p) { const b = byId(base, p.id); return !b || sig(b) !== sig(p); }
function deletedCount() { return base.projects.filter((b) => !byId(data, b.id)).length; }
function changedCount() { return data.projects.filter(isChanged).length + deletedCount(); }

function updateSaveState() {
  const el = $("saveState");
  const n = changedCount();
  const unsaved = sig(data) !== lastDownloadedSig && n > 0;
  if (!n) { el.textContent = "No edits yet"; el.className = ""; }
  else if (unsaved) { el.textContent = `${n} project${n > 1 ? "s" : ""} edited · saved in this browser · not downloaded yet`; el.className = "dirty"; }
  else { el.textContent = `${n} project${n > 1 ? "s" : ""} edited · downloaded`; el.className = ""; }
}
window.addEventListener("beforeunload", (e) => {
  if (data && changedCount() && sig(data) !== lastDownloadedSig) { e.preventDefault(); e.returnValue = ""; }
});

/* ======================= completeness ======================= */
function missingList(p) {
  const miss = [];
  const label = {};
  SECTIONS.forEach((s) => (s.fields || []).forEach((f) => { label[f[0]] = [f[1], s.id]; }));
  KEY_FIELDS.forEach((k) => { if (blank(p[k])) miss.push({ key: k, label: label[k][0], sec: label[k][1] }); });
  const tname = { sites: ["Sites", "sites"], habitat_plan: ["Habitat plan", "habitat"], funding: ["Funding rows", "funding"], contacts: ["Contacts", "contacts"] };
  KEY_TABLES.forEach((t) => { if (!p[t] || !p[t].length) miss.push({ key: t, label: tname[t][0], sec: tname[t][1], table: true }); });
  return miss;
}
function completeness(p) {
  const total = KEY_FIELDS.length + KEY_TABLES.length;
  return Math.round(100 * (total - missingList(p).length) / total);
}

/* ======================= list ======================= */
function renderList() {
  const q = $("search").value.trim().toLowerCase();
  const list = $("list");
  list.replaceChildren();
  const rows = data.projects
    .filter((p) => !q || (p.name || "").toLowerCase().includes(q) || String(p.id).includes(q))
    .filter((p) => filter === "all" ? true
      : filter === "needs" ? missingList(p).length > 0
      : filter === "unreviewed" ? !p.reviewed
      : filter === "reviewed" ? !!p.reviewed
      : filter === "changed" ? isChanged(p)
      : filter === "os" ? isOsEntry(p) : true);
  rows.forEach((p) => {
    const it = document.createElement("div");
    it.className = "item"; it.setAttribute("role", "listitem"); it.tabIndex = 0;
    if (p.id === currentId) it.setAttribute("aria-current", "true");
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = p.name || `Project ${p.id}`;
    const tags = document.createElement("div"); tags.style.display = "flex"; tags.style.gap = "4px"; tags.style.alignItems = "start";
    if (isOsEntry(p)) { const t = document.createElement("span"); t.className = "tag os"; t.textContent = "OneShoreline"; t.title = "OneShoreline entry"; tags.appendChild(t); }
    if (p.added_in_review) { const t = document.createElement("span"); t.className = "tag new"; t.textContent = "new"; tags.appendChild(t); }
    else if (isChanged(p)) { const t = document.createElement("span"); t.className = "tag changed"; t.textContent = "edited"; tags.appendChild(t); }
    if (p.reviewed) { const t = document.createElement("span"); t.className = "tag ok"; t.textContent = "✓ reviewed"; tags.appendChild(t); }
    const meta = document.createElement("div"); meta.className = "meta";
    const pct = completeness(p);
    const bar = document.createElement("span"); bar.className = "bar"; bar.title = `${pct}% of key fields filled`;
    const fill = document.createElement("span"); fill.style.width = pct + "%"; bar.appendChild(fill);
    const st = document.createElement("span"); st.textContent = `${p.status || "No status"} · ${pct}%`;
    meta.append(bar, st);
    it.append(nm, tags, meta);
    const go = () => { select(p.id); $("aside").classList.remove("open"); };
    it.addEventListener("click", go);
    it.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    list.appendChild(it);
  });
  const reviewed = data.projects.filter((p) => p.reviewed).length;
  $("listCount").textContent = `${rows.length} shown · ${reviewed} of ${data.projects.length} reviewed`;
}

/* ======================= detail ======================= */
function select(id) {
  currentId = id;
  try { history.replaceState(null, "", "#" + encodeURIComponent(id)); } catch (e) {}
  renderList();
  renderDetail();
  $("detail").scrollTop = 0;
}

function inputFor(kind, value, options, onChange) {
  let el;
  if (kind === "long") { el = document.createElement("textarea"); }
  else {
    el = document.createElement("input");
    el.type = kind === "num" || kind === "money" ? "number" : kind === "date" ? "date" : "text";
    if (kind === "num" || kind === "money") el.step = "any";
    if (kind === "list" && options) {
      const dl = document.createElement("datalist");
      dl.id = "dl-" + Math.random().toString(36).slice(2);
      options.forEach((o) => { const op = document.createElement("option"); op.value = o; dl.appendChild(op); });
      document.body.appendChild(dl);
      el.setAttribute("list", dl.id);
      el.placeholder = "Choose or type";
    }
  }
  if (kind === "date" && value && !/^\d{4}-\d{2}-\d{2}$/.test(value)) { el.type = "text"; }
  el.value = blank(value) ? "" : value;
  if (!el.placeholder) el.placeholder = "blank";
  el.addEventListener("input", () => {
    let v = el.value;
    if (v.trim() === "") v = null;
    else if (kind === "num" || kind === "money") { const n = Number(v); v = isFinite(n) ? n : v; }
    onChange(v);
  });
  return el;
}

function updateFundingCalc() {
  const p = byId(data, currentId); const c = $("fundingCalc"); if (!p || !c) return;
  const total = (p.funding || []).reduce((s, r) => s + (typeof r.amount === "number" ? r.amount : 0), 0);
  let txt = fmtMoney(total) + ` from ${(p.funding || []).length} row${(p.funding || []).length === 1 ? "" : "s"}`;
  c.className = "calc";
  if (typeof p.funding_need === "number") {
    const diff = p.funding_need - total;
    if (diff > 0) { txt += ` · ${fmtMoney(diff)} short of the funding need`; c.className = "calc gap"; }
    else txt += " · covers the funding need";
  }
  c.textContent = txt;
}

function renderTable(p, key) {
  const cols = TABLES[key];
  if (!p[key]) p[key] = [];
  const holder = document.createElement("div");   // stays in place; its contents are redrawn

  function draw(focusLast) {
    holder.replaceChildren();
    const wrap = document.createElement("div"); wrap.className = "tbl-wrap";
    const tbl = document.createElement("table");
    const thead = document.createElement("thead"); const hr = document.createElement("tr");
    cols.forEach((c) => { const th = document.createElement("th"); th.textContent = c[1]; hr.appendChild(th); });
    hr.appendChild(document.createElement("th"));
    thead.appendChild(hr); tbl.appendChild(thead);
    const tb = document.createElement("tbody");
    if (!p[key].length) {
      const tr = document.createElement("tr"); const td = document.createElement("td");
      td.colSpan = cols.length + 1; td.className = "none-row"; td.textContent = "No rows yet.";
      tr.appendChild(td); tb.appendChild(tr);
    }
    p[key].forEach((row, ri) => {
      const tr = document.createElement("tr");
      cols.forEach(([f, label, kind = "text", opts]) => {
        const td = document.createElement("td"); if (blank(row[f])) td.className = "blank";
        const inp = inputFor(kind, row[f], opts, (v) => {
          row[f] = v; td.classList.toggle("blank", blank(v)); store(); renderList();
          if (key === "funding") updateFundingCalc();
        });
        inp.setAttribute("aria-label", `${label}, row ${ri + 1}`);
        td.appendChild(inp); tr.appendChild(td);
      });
      const tdA = document.createElement("td"); tdA.className = "act";
      const del = document.createElement("button"); del.type = "button"; del.className = "icon"; del.textContent = "✕";
      del.title = "Delete this row"; del.setAttribute("aria-label", `Delete row ${ri + 1}`);
      del.addEventListener("click", () => {
        const removed = p[key].splice(ri, 1)[0];
        changed();
        toastUndo("Row deleted", () => { p[key].splice(ri, 0, removed); changed(); });
      });
      tdA.appendChild(del); tr.appendChild(tdA);
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); wrap.appendChild(tbl); holder.appendChild(wrap);

    const tools = document.createElement("div"); tools.className = "tbl-tools";
    const add = document.createElement("button"); add.type = "button"; add.textContent = "+ Add row"; add.dataset.add = key;
    add.addEventListener("click", () => {
      const r = {}; cols.forEach((c) => { r[c[0]] = null; }); p[key].push(r);
      changed(true);
    });
    tools.appendChild(add);
    if (key === "funding") {
      const n = document.createElement("span"); n.className = "count"; n.textContent = "Amounts add up into the total above.";
      tools.appendChild(n);
    }
    holder.appendChild(tools);
    if (focusLast) { const last = holder.querySelector("tbody tr:last-child input"); if (last) last.focus(); }
  }

  function changed(focusLast) {
    store(); renderList(); draw(focusLast);
    if (key === "funding") updateFundingCalc();
    const det = holder.closest("details");
    const note = det && det.querySelector(".sum-note");
    if (note) { const n = p[key].length; note.textContent = note.textContent.replace(/\d+ rows?$/, `${n} row${n === 1 ? "" : "s"}`); }
  }

  draw(false);
  return holder;
}

function toastUndo(msg, undo) {
  const t = $("toast"); t.replaceChildren(document.createTextNode(msg + " · "));
  const b = document.createElement("button"); b.type = "button"; b.textContent = "Undo";
  b.style.cssText = "padding:0 6px;background:transparent;color:inherit;border:1px solid currentColor;font-size:12px";
  b.addEventListener("click", () => { undo(); t.classList.remove("show"); });
  t.appendChild(b); t.style.pointerEvents = "auto"; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.classList.remove("show"); t.style.pointerEvents = "none"; }, 5000);
}

/* Excel export with change highlighting, compared with the published data file */
const FILL_EDIT = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFD8A8" } };   // orange: edited cell
const FILL_NEW  = { type: "pattern", pattern: "solid", fgColor: { argb: "FFC8E6C9" } };   // green: new project / new row
const FILL_HEAD = { type: "pattern", pattern: "solid", fgColor: { argb: "FF244161" } };
const show = (v) => blank(v) ? "(blank)" : String(v);
const same = (a, b) => (blank(a) && blank(b)) || String(a) === String(b);

function styleHeader(ws, n) {
  const r = ws.getRow(1);
  for (let c = 1; c <= n; c++) {
    const cell = r.getCell(c);
    cell.font = { name: "Arial", size: 10, bold: true, color: { argb: "FFFFFFFF" } };
    cell.fill = FILL_HEAD; cell.alignment = { vertical: "middle", wrapText: true };
  }
  r.height = 30;
  ws.views = [{ state: "frozen", xSplit: 1, ySplit: 1 }];
  ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: n } };
}
function mark(cell, fill, note) {
  cell.fill = fill;
  if (note) cell.note = { texts: [{ font: { name: "Arial", size: 9 }, text: note }] };
}

/* Pair published rows with current rows: identical rows match first (longest common subsequence),
   then leftover rows between matches are paired in order as edits; the rest are added or deleted. */
function alignRows(oldRows, newRows, cols) {
  const key = (r) => JSON.stringify(cols.map(([f]) => blank(r[f]) ? null : String(r[f])));
  const a = oldRows.map(key), b = newRows.map(key), n = a.length, m = b.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const anchors = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { anchors.push([i, j]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  anchors.push([n, m]);
  const pairs = []; let pi = 0, pj = 0;
  anchors.forEach(([ai, aj]) => {
    const go = ai - pi, gn = aj - pj, k = Math.min(go, gn);
    for (let t = 0; t < k; t++) pairs.push([pi + t, pj + t]);           // edited
    for (let t = k; t < go; t++) pairs.push([pi + t, null]);            // deleted
    for (let t = k; t < gn; t++) pairs.push([null, pj + t]);            // added
    if (ai < n) pairs.push([ai, aj]);                                    // unchanged
    pi = ai + 1; pj = aj + 1;
  });
  return pairs;
}

async function exportXlsx() {
  if (!window.ExcelJS) { toast("Excel library didn't load. Check your connection and try again."); return; }
  const wb = new ExcelJS.Workbook();
  wb.creator = "OneShoreline EcoAtlas Project Review";
  const log = [];   // [project id, project name, sheet, field, row, old, new, change]
  const font = { name: "Arial", size: 10 };
  const cs = wb.addWorksheet("Changes", { properties: { tabColor: { argb: "FFE8A33D" } } });   // first tab, filled at the end

  // ---- Projects
  const ws = wb.addWorksheet("Projects");
  ws.columns = XLSX_PROJECT_COLS.map(([k, label]) => ({ header: label, key: k,
    width: ["abstract", "cost_basis", "cost_source", "notes", "review_notes"].includes(k) ? 50 : k === "name" ? 40 : 18 }));
  styleHeader(ws, XLSX_PROJECT_COLS.length);
  data.projects.forEach((p) => {
    const b = byId(base, p.id);
    const total = (p.funding || []).reduce((s, r) => s + (typeof r.amount === "number" ? r.amount : 0), 0);
    const vals = {};
    XLSX_PROJECT_COLS.forEach(([k]) => {
      vals[k] = k === "_funding_total" ? total : k === "_os_entry" ? (isOsEntry(p) ? "Yes" : "No") : k === "reviewed" ? (p.reviewed ? "Yes" : "No") : (blank(p[k]) ? null : p[k]);
    });
    const row = ws.addRow(vals); row.font = font; row.alignment = { vertical: "top" };
    if (!b) {
      XLSX_PROJECT_COLS.forEach((_, i) => { row.getCell(i + 1).fill = FILL_NEW; });
      log.push([p.id, p.name, "Projects", "(whole project)", "", "", "", "Added"]);
      return;
    }
    XLSX_PROJECT_COLS.forEach(([k, label], i) => {
      if (k === "_funding_total" || k === "_os_entry") return;
      const oldV = k === "reviewed" ? (b.reviewed ? "Yes" : "No") : b[k];
      const newV = vals[k];
      if (!same(oldV, newV)) {
        mark(row.getCell(i + 1), FILL_EDIT, "Was: " + show(oldV));
        log.push([p.id, p.name, "Projects", label, "", show(oldV), show(newV), "Edited"]);
      }
    });
  });
  ws.getColumn("funding_need").numFmt = "$#,##0"; ws.getColumn("_funding_total").numFmt = "$#,##0";

  // ---- repeating tables (rows compared in order with the published file)
  Object.entries(XLSX_SHEETS).forEach(([key, sheet]) => {
    const cols = TABLES[key];
    const s = wb.addWorksheet(sheet);
    s.columns = [{ header: "EcoAtlas Project ID", key: "_id", width: 18 },
      ...cols.map(([f, label]) => ({ header: label, key: f, width: f === "funder" || f === "description" ? 40 : 22 }))];
    styleHeader(s, cols.length + 1);
    data.projects.forEach((p) => {
      const b = byId(base, p.id);
      const oldRows = (b && b[key]) || [];
      const cur = p[key] || [];
      const pairs = b ? alignRows(oldRows, cur, cols) : cur.map((_, j) => [null, j]);
      const summary = (r) => cols.map(([f]) => r[f]).filter((v) => !blank(v)).join(" | ");
      // write current rows in their order; look up each row's published counterpart
      const oldFor = new Map(pairs.filter(([o, nn]) => nn !== null).map(([o, nn]) => [nn, o]));
      cur.forEach((r, ri) => {
        const vals = { _id: p.id }; cols.forEach(([f]) => { vals[f] = blank(r[f]) ? null : r[f]; });
        const row = s.addRow(vals); row.font = font;
        const oi = oldFor.get(ri);
        if (!b || oi === null || oi === undefined) {
          for (let c = 1; c <= cols.length + 1; c++) row.getCell(c).fill = FILL_NEW;
          if (b) log.push([p.id, p.name, sheet, "(new row)", ri + 1, "", summary(r), "Row added"]);
          return;
        }
        const old = oldRows[oi];
        cols.forEach(([f, label], ci) => {
          if (!same(old[f], r[f])) {
            mark(row.getCell(ci + 2), FILL_EDIT, "Was: " + show(old[f]));
            log.push([p.id, p.name, sheet, label, ri + 1, show(old[f]), show(r[f]), "Edited"]);
          }
        });
      });
      if (b) pairs.filter(([o, nn]) => nn === null).forEach(([o]) =>
        log.push([p.id, p.name, sheet, "(row removed)", "", summary(oldRows[o]), "", "Row deleted"]));
    });
    if (key === "funding") s.getColumn("amount").numFmt = "$#,##0";
  });

  // deleted projects
  base.projects.filter((bp) => !byId(data, bp.id)).forEach((bp) =>
    log.push([bp.id, bp.name, "Projects", "(whole project)", "", "", "", "Deleted"]));

  // ---- Changes sheet (first tab)
  cs.columns = [
    { header: "EcoAtlas Project ID", width: 18 }, { header: "Project", width: 40 }, { header: "Sheet", width: 16 },
    { header: "Field", width: 26 }, { header: "Row", width: 6 }, { header: "Old value", width: 40 },
    { header: "New value", width: 40 }, { header: "Change", width: 12 }];
  styleHeader(cs, 8);
  if (!log.length) cs.addRow(["", "No changes compared with the published data file."]).font = font;
  log.forEach((l) => {
    const row = cs.addRow(l); row.font = font; row.alignment = { vertical: "top", wrapText: true };
    row.getCell(8).fill = l[7] === "Edited" ? FILL_EDIT : (l[7] === "Added" || l[7] === "Row added") ? FILL_NEW
      : { type: "pattern", pattern: "solid", fgColor: { argb: "FFF4C7C3" } };
  });
  const keyRow = cs.rowCount + 2;
  cs.getCell(`A${keyRow}`).value = "Key"; cs.getCell(`A${keyRow}`).font = { ...font, bold: true };
  [["Orange", FILL_EDIT, "Edited value (hover the cell for the old value)"],
   ["Green", FILL_NEW, "New project or new row"],
   ["Red", { type: "pattern", pattern: "solid", fgColor: { argb: "FFF4C7C3" } }, "Deleted (listed here only)"]].forEach(([n, f, t], i) => {
    const r = keyRow + 1 + i; cs.getCell(`A${r}`).value = n; cs.getCell(`A${r}`).fill = f; cs.getCell(`A${r}`).font = font;
    cs.getCell(`B${r}`).value = t; cs.getCell(`B${r}`).font = font;
  });
  cs.getCell(`A${keyRow + 5}`).value = `Compared with the published data file dated ${base.updated || "unknown"}. Downloaded ${new Date().toISOString().slice(0, 10)}.`;
  cs.getCell(`A${keyRow + 5}`).font = { ...font, italic: true, color: { argb: "FF5F6B73" } };

  const buf = await wb.xlsx.writeBuffer();
  download(`ecoatlas_projects_${new Date().toISOString().slice(0, 10)}.xlsx`,
    new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  toast(log.length ? `Excel downloaded with ${log.length} change${log.length > 1 ? "s" : ""} highlighted.` : "Excel downloaded. No changes to highlight.");
}

function importFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      if (!obj || !Array.isArray(obj.projects)) throw new Error("This doesn't look like a review data file.");
      const before = clone(data);
      data = obj; store();
      if (!byId(data, currentId)) currentId = data.projects[0] && data.projects[0].id;
      renderList(); renderDetail();
      toastUndo(`Loaded ${obj.projects.length} projects from ${file.name}`, () => { data = before; store(); renderList(); renderDetail(); });
    } catch (e) { toast("Couldn't read that file: " + e.message); }
  };
  rd.readAsText(file);
}

/* ======================= banners ======================= */
function banner(text, actions) {
  const b = document.createElement("div"); b.className = "banner";
  const s = document.createElement("span"); s.textContent = text; b.appendChild(s);
  const sp = document.createElement("span"); sp.className = "spacer"; b.appendChild(sp);
  actions.forEach(([label, fn, primary]) => {
    const btn = document.createElement("button"); btn.type = "button"; btn.textContent = label;
    if (primary) btn.className = "primary";
    btn.addEventListener("click", () => { fn(); b.remove(); });
    b.appendChild(btn);
  });
  $("banners").appendChild(b);
}

/* ======================= new projects ======================= */
function newTempId() {
  let n = 1; while (byId(data, "NEW-" + n)) n++; return "NEW-" + n;
}
function blankProject(id, name, region) {
  const p = { id, name, url: String(id).startsWith("NEW-") ? null : ecoUrl(id) };
  SECTIONS.forEach((s) => (s.fields || []).forEach((f) => { if (!(f[0] in p)) p[f[0]] = null; }));
  Object.keys(TABLES).forEach((k) => { p[k] = []; });
  Object.assign(p, { name, region, oneshoreline: "Yes", data_source: "Added in review page", reviewed: false,
    review_notes: null, added_in_review: true });
  return p;
}
$("btnNew").addEventListener("click", () => {
  const f = $("newForm"); const open = !f.classList.contains("open");
  f.classList.toggle("open", open); $("btnNew").textContent = open ? "Close" : "+ New project";
  $("newMsg").textContent = ""; if (open) $("newName").focus();
});
$("newCancel").addEventListener("click", () => { $("newForm").classList.remove("open"); $("btnNew").textContent = "+ New project"; });
$("newForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("newName").value.trim(); const rawId = $("newId").value.trim();
  if (!name) { $("newMsg").textContent = "Give the project a name."; return; }
  const id = rawId === "" ? newTempId() : (/^\d+$/.test(rawId) ? Number(rawId) : rawId);
  if (rawId && byId(data, id)) { $("newMsg").textContent = `ID ${rawId} is already in the list.`; return; }
  const p = blankProject(id, name, $("newRegion").value);
  data.projects.push(p);
  $("newForm").reset(); $("newForm").classList.remove("open"); $("btnNew").textContent = "+ New project";
  filter = "all"; document.querySelectorAll("#filters .chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.f === "all")));
  $("search").value = "";
  store(); select(p.id);
  toast(rawId ? "Project added. Use Open in EcoAtlas to copy in its details." : "Project added. Add its EcoAtlas ID at the top when it has one.");
});

/* ======================= start ======================= */
fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.json(); })
  .then((json) => {
    base = json;
    const draft = loadDraft();
    data = clone(base);
    if (draft && draft.data && Array.isArray(draft.data.projects)) {
      lastDownloadedSig = draft.lastDownloadedSig || null;
      const sameBase = draft.baseUpdated === base.updated && draft.baseVersion === base.version;
      const draftHasEdits = draft.data.projects.some((p) => { const b = byId(base, p.id); return !b || sig(b) !== sig(p); });
      if (sameBase) data = draft.data;
      else if (draftHasEdits) {
        data = draft.data;
        banner("The published data file has been updated since your last session, but this browser still has your earlier edits.",
          [["Keep my edits", () => {}, true],
           ["Switch to the published file", () => { data = clone(base); lastDownloadedSig = null; clearDraft(); store(); renderList(); renderDetail(); }]]);
      }
    }
    const fromHash = decodeURIComponent(location.hash.slice(1));
    currentId = byId(data, fromHash) ? fromHash : data.projects[0].id;
    renderList(); renderDetail(); updateSaveState();
  })
  .catch((err) => {
    $("detail").innerHTML = "";
    const d = document.createElement("div"); d.className = "empty-state";
    d.textContent = `Couldn't load ${DATA_URL} (${err.message}). Check that it's uploaded next to review.html in the repo.`;
    $("detail").appendChild(d); $("saveState").textContent = "";
  });

$("search").addEventListener("input", renderList);
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters .chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
  renderList();
});
$("btnJson").addEventListener("click", exportJson);
$("btnXlsx").addEventListener("click", exportXlsx);
$("btnImport").addEventListener("click", () => $("fileImport").click());
$("fileImport").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ""; });
$("listToggle").addEventListener("click", () => $("aside").classList.toggle("open"));
</script>
